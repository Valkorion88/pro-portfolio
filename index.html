<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamilton Darling</title>
  <script src="app.js"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/d691212dbc.js" crossorigin="anonymous"></script>
</head>
<body>
  <section id="landing-page">
    <nav>
      <figure>
        <img id="personal-logo" src="./assets/hamdarling-logo.svg" alt="Personal Logo">
      </figure>
      <ul class="nav__link--list">
        <li class="nav__link">
          <a href="#" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">About</a>
        </li>
        <li class="nav__link">
          <a href="#" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">Projects</a>
        </li>
        <li class="nav__link">
          <a href="#" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">Contact</a>
        </li>
        <li class="nav__link click">
          <a href="#" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          "><i class="fa-solid fa-circle-half-stroke"></i></a>
        </li>
      </ul>

    <header class="header">
      <div class="header__content">
        <h1 class="title">Hey</h1>

          Here's a bit more <b class="highlight__color">about me</b>.
        </p>
        <div class="social__list">
          <a href="https://www.linkedin.com/in/hamilton-darling-64bbb010b/" target="_blank" class="social__link click">

          </a>
          <a href="https://github.com/Valkorion88" target="_blank" class="social__link click">
            <i class="fa-brands fa-github"></i>
          </a>
          <a href="./assets/Hamilton_Darling_Resume (1).pdf" target="_blank" class="social__link click">
            <i class="fa-solid fa-file"></i>
          </a>
        </div>
      </div>
    </header>
    <button class="mail__btn click">
      <i class="fa-solid fa-envelope"></i>
    </button>
    <a href="#projects" class="scroll">
      <div class="scroll__icon click"></div>
    </a>
  </section>

</html>
